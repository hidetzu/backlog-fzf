name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer push or PR update arrives
# (saves CI time when multiple PRs are running concurrently).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Read the go directive from go.mod (follows patch versions like 1.26.2).
          go-version-file: 'go.mod'
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -race ./...

      - name: go build
        run: go build ./...
