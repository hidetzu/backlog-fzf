name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel an in-progress run when a newer push or PR update arrives
# (saves CI time when multiple PRs are running concurrently).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Read the go directive from go.mod (follows patch versions like 1.26.2).
          go-version-file: 'go.mod'
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy. Run 'go mod tidy' locally and commit the result."
            git diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -race ./...

      - name: go build
        run: go build ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  pr-template:
    name: PR template check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check 'Type of change' is selected
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${PR_BODY:-}" ]; then
            echo "::error::PR body is empty. Please fill out the PR template."
            exit 1
          fi
          section=$(printf '%s\n' "$PR_BODY" | awk '
            /^## Type of change/ { in_section=1; next }
            /^## / && in_section { in_section=0 }
            in_section { print }
          ')
          if ! printf '%s\n' "$section" | grep -qE '^[[:space:]]*- \[[xX]\]'; then
            echo "::error::Please check at least one item under '## Type of change' in the PR description."
            exit 1
          fi
          echo "OK: Type of change has at least one selection."
